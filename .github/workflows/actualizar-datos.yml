name: Actualizar datos

# Cada lunes descarga datos nuevos, vuelve a ejecutar el notebook y abre un pull request.
# No hace commit directo a main: el PDF y las diapositivas citan cifras que habría que revisar antes de publicar.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-notebook.txt
      - run: python reproducir.py --descargar --sin-pdf
      - name: Abrir pull request con los datos nuevos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          rama="datos/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$rama"
          git add -A datos notebook resultados dashboard/datos documento/figuras
          git commit -m "Datos actualizados al $(date -u +%Y-%m-%d)"
          git push origin "$rama"
          gh pr create --title "Datos actualizados al $(date -u +%Y-%m-%d)" \
            --body "Descarga automática, notebook ejecutado y pruebas en verde. Revisar si cambian las cifras del documento y de las diapositivas antes de fusionar."
